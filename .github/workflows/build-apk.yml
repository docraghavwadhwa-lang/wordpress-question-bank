name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "public/icon-*.png", "public/manifest.json", "public/qimg/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Create Android project
        working-directory: mobile
        run: |
          npm init -y >/dev/null
          npm i @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/local-notifications@7
          # Bundle every question image inside the APK for offline use
          rm -rf www/qimg && cp -r ../public/qimg www/qimg
          npx cap add android
          npx cap sync android
          # Deep link so Google sign-in returns to the app
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="com.nirmayacare.medquiz" android:host="auth" /></intent-filter></activity>#' android/app/src/main/AndroidManifest.xml
          grep -q 'com.nirmayacare.medquiz' android/app/src/main/AndroidManifest.xml
          # Native image server: answers /qimg/* from the bundled files
          cp MainActivity.java android/app/src/main/java/com/nirmayacare/medquiz/MainActivity.java
          ls android/app/src/main/assets/public/qimg | wc -l
      - name: App icons
        working-directory: mobile/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../../public/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../../public/icon-192.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          # Splash: logo centred on teal (never stretched)
          find . -name 'splash.png' -delete
          mkdir -p drawable-nodpi && cp ../../../../../splash_logo.png drawable-nodpi/splash_logo.png
          cp ../../../../../splash.xml drawable/splash.xml
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item><item name="android:windowBackground">@drawable/splash</item>#' values/styles.xml || true
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../MedQuiz.apk
      # Google Play bundle (.aab). Signed with your upload key when the
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets exist.
      - name: Sign Play bundle
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab Elixir.aab
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > upload.jks
            jarsigner -keystore upload.jks -storepass "$KS_PASS" Elixir.aab "$KS_ALIAS"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Elixir-android
          path: |
            MedQuiz.apk
            Elixir.aab
      # Public download link used by the website's "Get the app" page
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Elixir Android (latest)
          files: |
            MedQuiz.apk
            Elixir.aab
          make_latest: true
